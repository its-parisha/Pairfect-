<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker with Charts</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue, push, remove, query, orderByChild, limitToLast } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        
        window.firebaseConfig = {
            apiKey: "AIzaSyDxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", // Replace with your Firebase config
            authDomain: "your-project.firebaseapp.com",
            databaseURL: "https://your-project-default-rtdb.firebaseio.com/",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:xxxxxxxxxxxxxxxxxx"
        };
        
        window.db = getDatabase(initializeApp(window.firebaseConfig));
        window.ref = ref;
        window.onValue = onValue;
        window.push = push;
        window.remove = remove;
        window.query = query;
        window.orderByChild = orderByChild;
        window.limitToLast = limitToLast;
    </script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --danger-gradient: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 80px;
        }

        /* Navbar Styles */
        .navbar {
            background: var(--primary-gradient) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 0.75rem 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .navbar-brand .dropdown-toggle {
            text-decoration: none !important;
            color: white !important;
        }

        .navbar-brand .dropdown-toggle:focus {
            box-shadow: none;
        }

        .dropdown-menu {
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: none;
            min-width: 280px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-item {
            border-radius: 10px;
            margin: 2px 8px;
            transition: all 0.3s ease;
            padding: 12px 16px;
        }

        .dropdown-item:hover {
            background: var(--primary-gradient);
            color: white !important;
            transform: translateX(5px);
        }

        .navbar-nav .nav-link {
            font-size: 2.2rem !important;
            line-height: 1.2;
            font-weight: 700;
            color: white !important;
        }

        .input-group .form-control {
            border-radius: 25px 0 0 25px !important;
            padding: 12px 20px;
            border: none !important;
            background: rgba(255,255,255,0.9);
        }

        .input-group .input-group-text {
            border-radius: 25px 0 0 25px;
            border-right: none !important;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .input-group .btn {
            border-radius: 0 25px 25px 0;
            border-left: none !important;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        #clearSearch {
            display: none;
        }

        #searchInput:focus {
            box-shadow: none;
            background: white;
        }

        h1 {
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .card {
            border: none;
            border-radius: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1) !important;
        }

        .card-header {
            border-radius: 15px 15px 0 0 !important;
            font-weight: 600;
        }

        .display-6 {
            font-weight: 700;
            font-size: 2.5rem;
        }

        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            padding: 12px 15px;
        }

        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-danger {
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.875rem;
            transition: all 0.3s ease;
        }

        .btn-danger:hover {
            transform: scale(1.05);
        }

        .table-hover tbody tr:hover {
            background-color: rgba(102, 126, 234, 0.1);
        }

        .type-income { color: #28a745; font-weight: 600; }
        .type-expense { color: #dc3545; font-weight: 600; }

        .category-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .category-food { background-color: #ff6b6b; color: white; }
        .category-travel { background-color: #4ecdc4; color: white; }
        .category-bills { background-color: #45b7d1; color: white; }
        .category-shopping { background-color: #f9ca24; color: #333; }
        .category-others { background-color: #6c5ce7; color: white; }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .search-highlight {
            background: linear-gradient(120deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .table-responsive::-webkit-scrollbar {
            height: 8px;
        }

        .table-responsive::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .table-responsive::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .table-responsive::-webkit-scrollbar-thumb:hover {
            background: #5a67d8;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            animation: slideInRight 0.3s ease-out;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 991px) {
            .navbar-nav .nav-link { font-size: 1.8rem !important; }
            body { padding-top: 70px; }
        }

        @media (max-width: 768px) {
            .navbar-nav .nav-link { font-size: 1.5rem !important; }
            .input-group { max-width: 250px !important; }
            body { padding-top: 65px; }
            .display-6 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow-lg">
        <div class="container-fluid">
            <!-- User Profile Dropdown -->
            <div class="navbar-brand d-flex align-items-center me-0 pe-0">
                <div class="dropdown">
                    <button class="btn btn-link text-white p-0 nav-link dropdown-toggle d-flex align-items-center" 
                            type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-user-circle fa-2x me-2"></i>
                        <span class="d-none d-md-inline">John Doe</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-start shadow-lg border-0 mt-2">
                        <li class="px-3 py-2 border-bottom">
                            <div class="d-flex align-items-center">
                                <i class="fas fa-user-circle fa-2x text-primary me-3"></i>
                                <div>
                                    <h6 class="mb-0 fw-bold">John Doe</h6>
                                    <small class="text-muted">john.doe@email.com</small>
                                </div>
                            </div>
                        </li>
                        <li><a class="dropdown-item py-2" href="#"><i class="fas fa-user me-2"></i>Profile</a></li>
                        <li><a class="dropdown-item py-2" href="#"><i class="fas fa-cog me-2"></i>Settings</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item py-2 text-danger fw-bold" href="#"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>

            <!-- Center Logo -->
            <div class="navbar-nav mx-auto">
                <a class="nav-link px-0 fw-bold fs-3 text-white text-decoration-none" href="#" style="font-family: 'Segoe UI', sans-serif;">
                    <i class="fas fa-wallet me-2"></i>
                    Expense Tracker
                </a>
            </div>

            <!-- Search -->
            <div class="d-flex">
                <div class="input-group input-group-sm" style="max-width: 300px;">
                    <span class="input-group-text bg-transparent border-0 text-white">
                        <i class="fas fa-search"></i>
                    </span>
                    <input type="text" class="form-control border-0 bg-light shadow-none" 
                           id="searchInput" placeholder="Search transactions..." autocomplete="off">
                    <button class="btn btn-outline-light btn-sm" type="button" id="clearSearch">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Status Indicator -->
    <div id="statusIndicator" class="status-indicator bg-success text-white d-none">
        <i class="fas fa-check-circle me-2"></i> Synced with Database
    </div>

    <div class="container-fluid py-4 pt-lg-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-5 text-primary d-none d-lg-block">
                    💰 Dashboard
                </h1>
            </div>
        </div>

        <!-- Dashboard Cards -->
        <div class="row mb-5" id="dashboard">
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="card text-white bg-success shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title">Total Income</h5>
                        <h2 class="display-6" id="totalIncome">$0.00</h2>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="card text-white bg-danger shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title">Total Expenses</h5>
                        <h2 class="display-6" id="totalExpenses">$0.00</h2>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-12 mb-4">
                <div class="card text-white bg-info shadow-sm" id="balanceCard">
                    <div class="card-body text-center">
                        <h5 class="card-title">Balance</h5>
                        <h2 class="display-6" id="balance">$0.00</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="row mb-5">
            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Expense Distribution</h5>
                    </div>
                    <div class="card-body p-4">
                        <canvas id="expensePieChart" height="300"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Income vs Expenses</h5>
                    </div>
                    <div class="card-body p-4">
                        <canvas id="incomeExpenseBarChart" height="300"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Add New Transaction</h5>
                    </div>
                    <div class="card-body">
                        <form id="transactionForm">
                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label for="amount" class="form-label">Amount ($)</label>
                                    <input type="number" class="form-control" id="amount" step="0.01" min="0.01" required>
                                </div>
                                <div class="col-md-3">
                                    <label for="type" class="form-label">Type</label>
                                    <select class="form-select" id="type" required>
                                        <option value="">Select Type</option>
                                        <option value="income">Income</option>
                                        <option value="expense">Expense</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="category" class="form-label">Category</label>
                                    <select class="form-select" id="category" required>
                                        <option value="">Select Category</option>
                                        <option value="food">Food</option>
                                        <option value="travel">Travel</option>
                                        <option value="bills">Bills</option>
                                        <option value="shopping">Shopping</option>
                                        <option value="others">Others</option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <label for="date" class="form-label">Date</label>
                                    <input type="date" class="form-control" id="date" required>
                                </div>
                                <div class="col-md-1 d-flex align-items-end">
                                    <button type="submit" class="btn btn-primary w-100" id="addBtn">
                                        <span class="btn-text">Add</span>
                                        <span class="loading d-none"></span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div
